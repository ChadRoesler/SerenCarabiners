# {carabiner}.yaml - how the {display} carabiner rolls on THIS box.
# Pushed out of {carabiner}.kbh by `install`; read by every verb afterwards
# (found beside the .kbh, or --config PATH, or KBH_CONFIG, or ~/.seren/kbh/).
# Relative paths are relative to this file's folder. Edit freely; a new
# {carabiner}.kbh dropped in never overwrites this file.
carabiner: {carabiner}

# Where wakes run: the model's working folder. Only the Copilot CLI can be
# woken; Copilot in an editor is registered and nothing more.
project: {project}

# What runs the .kbh from ripples. A service account hands a process its own
# PATH, so name the python outright.
python: {python}

# The folder of connection files: one per Seren service the harness talks
# to, each the service's `server:` block (host, port, token or a pointer).
connections: {connections}

# What `kbh copilot register apply` writes into ~/.copilot/mcp-config.json,
# the file the Copilot CLI and Copilot in VS Code both read: a name the model
# will see -> a ROUTE (`kbh copilot route add NAME URL` writes one for you):
#   memory:
#     url: http://127.0.0.1:7420
#     bearer_token_env: SEREN_MEMORY_TOKEN   # no secret in Copilot's file: it reads the variable when it connects
#     # or bearer_token: "..." / bearer_token_keyring: "svc/user" - Copilot has no headers helper, so
#     # the token is then COPIED into mcp-config.json (0600): register again after it is rotated
# or a connection file in `connections` (the service's own config works):
#   memory: memory.yaml
servers:
{servers}
# Margin's bookmark: not built for Copilot yet. Leave it blank.
bookmark: {bookmark}

# The text a woken session is given first: who it is, where its memory is,
# when to stop. A file beside this one, yours to edit; blank = the
# carabiner's built-in default. A named file that is missing refuses to wake.
framing: framing.md

wake:
  timeout_seconds: 900

# What a wake runs on; blank = Copilot's own default:
#   session:
#     model: gpt-5.3
